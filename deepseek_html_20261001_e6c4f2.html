<script>
/* === ЗАЩИТА === */
document.addEventListener('copy', e => { e.preventDefault(); });
document.addEventListener('cut', e => { e.preventDefault(); });
document.addEventListener('contextmenu', e => { e.preventDefault(); });
document.addEventListener('selectstart', e => { e.preventDefault(); });
document.addEventListener('keydown', e => {
  const m = e.ctrlKey || e.metaKey;
  if (m && ['c','C','a','A','x','X','v','V'].includes(e.key)) {
    e.preventDefault();
    return false;
  }
});

document.querySelectorAll('textarea').forEach(ta => {
  ta.addEventListener('paste', e => {
    e.preventDefault();
    showPasteWarning(ta);
    return false;
  });
  ta.addEventListener('drop', e => { e.preventDefault(); return false; });
  ta.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
  ta.addEventListener('selectstart', e => { e.stopPropagation(); });
  ta.addEventListener('mousedown', e => { e.stopPropagation(); });
});

function showPasteWarning(ta) {
  const out = ta.parentElement.querySelector('.output');
  if (!out) return;
  const prev = out.textContent;
  out.textContent = '🚫 Вставка запрещена! Набирай код вручную.';
  out.classList.add('hint');
  setTimeout(() => {
    if (out.textContent.startsWith('🚫')) {
      out.textContent = prev || 'Здесь появится результат';
      out.classList.remove('hint');
    }
  }, 2200);
}

/* === ПРОГРЕСС === */
const STORAGE_KEY = 'python_11_progress';
let progress = {
  name: '',
  dz_1: false, dz_2: false, dz_3: false,
  hint_1: false, hint_2: false, hint_3: false
};

function loadProgress() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) Object.assign(progress, JSON.parse(s));
  } catch(e) {}
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch(e) {}
}
loadProgress();

/* === ПОДСКАЗКИ === */
function useHint(n) {
  if (progress['hint_' + n]) return;
  progress['hint_' + n] = true;
  saveProgress();
  document.getElementById('hint-' + n).classList.add('visible');
  const btn = event.target;
  btn.classList.add('used');
  btn.textContent = '💡 Подсказка использована';
  btn.disabled = true;
  updateScore();
}

/* === СЧЁТ БАЛЛОВ === */
function calculateScore() {
  let score = 0;
  for (let i = 1; i <= 3; i++) {
    if (progress['dz_' + i]) {
      score += progress['hint_' + i] ? 0.5 : 1;
    }
  }
  return score;
}

function updateScore() {
  const score = calculateScore();
  document.getElementById('scoreNum').textContent = formatScore(score);
  document.getElementById('totalScore').textContent = formatScore(score);

  const anyHints = ['hint_1','hint_2','hint_3'].some(k => progress[k]);
  const note = document.getElementById('hintNote');
  if (anyHints && score < 3) note.classList.add('visible');
  else note.classList.remove('visible');

  let msg = 'Начни с первой задачи — она самая простая';
  if (score >= 3) msg = '🏆 Все три задачи решены без подсказок! Отлично!';
  else if (score >= 2) msg = '👍 Хорошо! Ещё одна задача — и максимум.';
  else if (score >= 1) msg = 'Продолжай — начало положено!';
  else if (anyHints) msg = 'Подсказки использованы, но задачи ещё можно решить.';
  document.getElementById('resultMessage').textContent = msg;
}

function formatScore(s) {
  return Number.isInteger(s) ? s.toString() : s.toFixed(1);
}

/* === ИНТЕРПРЕТАТОР === */
function fmt(v) {
  if (Array.isArray(v)) return '[' + v.map(x => typeof x === 'string' ? `'${x}'` : fmt(x)).join(', ') + ']';
  if (typeof v === 'number' && !Number.isInteger(v)) return Math.round(v * 1000) / 1000;
  if (typeof v === 'boolean') return v ? 'True' : 'False';
  if (v === null || v === undefined) return 'None';
  return String(v);
}

function stripComments(code) {
  return code.split('\n').map(l => l.split('#')[0]).join('\n');
}

function runCodeRaw(code) {
  let buffer = '';
  const __out = (...args) => { buffer += args.map(fmt).join(' ') + '\n'; };

  const cleanCode = stripComments(code);
  const lines = cleanCode.split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].includes('?')) {
      return { output: buffer, error: `В строке ${i + 1} остался «?».` };
    }
  }
  if (!cleanCode.trim()) {
    return { output: '', empty: true };
  }

  try {
    const js = translatePython(cleanCode);
    const wrapped = `
      const __print = (...a) => __out(...a);
      ${js}
    `;
    new Function('__out', wrapped)(__out);
    return { output: buffer || '(нет вывода)' };
  } catch (e) {
    return { output: buffer, error: e.message };
  }
}

function translatePython(code) {
  const lines = code.split('\n'); let js = ''; const stack = [];
  for (let raw of lines) {
    const ci = raw.indexOf('#'); let line = ci >= 0 ? raw.slice(0, ci) : raw;
    if (line.trim() === '') continue;
    const indent = line.match(/^\s*/)[0].length; let t = line.trim();

    while (stack.length && indent <= stack[stack.length-1].indent) {
      js += ' '.repeat(stack[stack.length-1].indent) + '}\n';
      stack.pop();
    }

    let mDef = t.match(/^def\s+([A-Za-z_]\w*)\s*\(([^)]*)\)\s*:$/);
    if (mDef) {
      js += ' '.repeat(indent) + `function ${mDef[1]}(${mDef[2].trim()}) {\n`;
      stack.push({ type: 'def', indent });
      continue;
    }
    if (t.startsWith('return ')) {
      js += ' '.repeat(indent) + `return ${t.slice(7).trim()};\n`;
      continue;
    }

    t = t.replace(/\bprint\s*\(/g, '__print(');
    t = t.replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false').replace(/\bNone\b/g, 'null');

    js += ' '.repeat(indent) + t + ';\n';
  }
  while (stack.length) { js += ' '.repeat(stack[stack.length-1].indent) + '}\n'; stack.pop(); }
  return js;
}

/* === ЗАПУСК ЗАДАЧ === */
const dzDefaults = {};
for (let i = 1; i <= 3; i++) {
  const el = document.getElementById('code-dz-' + i);
  if (el) dzDefaults[i] = el.value;
}

function runDz(n) {
  const code = document.getElementById('code-dz-' + n).value;
  const out = document.getElementById('out-dz-' + n);
  const taskEl = document.getElementById('task-' + n);
  const result = runCodeRaw(code);

  if (result.empty) {
    out.textContent = 'Напиши код ✍️';
    out.classList.remove('error','success','hint');
    return;
  }
  if (result.error) {
    out.textContent = '❌ ' + result.error;
    out.classList.add('error');
    out.classList.remove('success','hint');
    return;
  }

  out.textContent = result.output;
  out.classList.remove('error','hint','success');

  const ok = checkers[n](code, result.output);
  if (ok) {
    out.classList.add('success');
    const withHint = progress['hint_' + n];
    const points = withHint ? 0.5 : 1;

    // Если задача ещё не решена — начисляем
    if (!progress['dz_' + n]) {
      progress['dz_' + n] = true;
      saveProgress();
      updateScore();
      taskEl.classList.add('done');
    }

    out.textContent += `\n\n✦ Задача решена! +${formatScore(points)} балла${withHint ? ' (с подсказкой)' : ''}`;
  }
}

function resetDz(n) {
  const el = document.getElementById('code-dz-' + n);
  if (dzDefaults[n]) el.value = dzDefaults[n];
  const out = document.getElementById('out-dz-' + n);
  out.textContent = 'Здесь появится результат';
  out.classList.remove('error','success','hint');
}

/* === ПРОВЕРКИ === */
function outputLines(output) { return output.trim().split('\n').map(l => l.trim()).filter(l => l); }

const checkers = {
  1: (code, output) => {
    const clean = stripComments(code);
    const hasDef = /def\s+school_bell\s*\(\s*\)\s*:/.test(clean);
    const hasCall = /school_bell\s*\(\s*\)/.test(clean);
    const lines = outputLines(output);
    const hasBell = /🔔|Урок начался/i.test(output);
    const hasBooks = /📚|Приготовьтесь/i.test(output);
    const hasTime = /⏰|45 минут/i.test(output);
    return hasDef && hasCall && lines.length >= 3 && hasBell && hasBooks && hasTime;
  },
  2: (code, output) => {
    const clean = stripComments(code);
    const hasDef = /def\s+welcome\s*\(\s*\w+\s*,\s*\w+\s*\)\s*:/.test(clean);
    const calls = (clean.match(/welcome\s*\(\s*["'][^"']*["']\s*,\s*["'][^"']*["']\s*\)/g) || []).length;
    const lines = outputLines(output);
    // Мягче: строка содержит и «Привет», и «Добро пожаловать в»
    const greetings = lines.filter(l => /Привет/i.test(l) && /Добро пожаловать в/i.test(l)).length;
    return hasDef && calls >= 2 && greetings >= 2;
  },
  3: (code, output) => {
    const clean = stripComments(code);
    const hasDef = /def\s+discount\s*\(\s*\w+\s*,\s*\w+\s*\)\s*:/.test(clean);
    const hasReturn = /return\s+price\s*\*\s*\(\s*1\s*-\s*percent\s*\/\s*100\s*\)/.test(clean);
    const callMatches = clean.match(/discount\s*\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*\)/g) || [];
    if (callMatches.length < 2) return false;

    const expected = [];
    callMatches.slice(0, 2).forEach(call => {
      const m = call.match(/discount\s*\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*\)/);
      expected.push(parseFloat(m[1]) * (1 - parseFloat(m[2]) / 100));
    });

    // Ищем числа в любом месте вывода (а не только целые строки)
    const foundNumbers = (output.match(/\d+(?:\.\d+)?/g) || []).map(Number);
    if (foundNumbers.length < 2) return false;

    let matches = 0;
    expected.forEach(exp => {
      if (foundNumbers.some(v => Math.abs(v - exp) < 0.5)) matches++;
    });
    return hasDef && hasReturn && matches >= 2;
  }
};

/* === ИНИЦИАЛИЗАЦИЯ === */
updateScore();
</script>
